[project]
name = "cojidaily"
version = "0.1.0"
description = "CojiDaily, rebuilt: a FastAPI modular monolith on PostgreSQL (pm/topics/project-rebuild.md)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]>=3.2",
    "argon2-cffi",
    "python-multipart",
    # Photos: the versions api/ and backend/ use, so previews and the model's JPEGs are the same bytes.
    "pillow==12.3.0",
    "pillow-heif==1.8.0",
    # The reading engine marks its spans and token metrics through the API only (no-ops without an SDK).
    "opentelemetry-api",
]

[project.optional-dependencies]
# What a deployed image needs to send telemetry (deploy/README.md). Dev runs without it: the
# OpenTelemetry API calls in the code then do nothing.
otel = [
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    # SQL at the driver: the SQLAlchemy instrumentation skips SQLAlchemy 2.1 (it supports < 2.1).
    "opentelemetry-instrumentation-psycopg",
    "opentelemetry-instrumentation-urllib",
]

[dependency-groups]
# The SDK only to check in a test what jobs report (tests/test_job_telemetry.py).
dev = ["pytest", "httpx", "opentelemetry-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cojidaily"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
