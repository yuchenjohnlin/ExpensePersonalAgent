# nginx in front of the rebuilt app (deploy/README.md): the built page from this image, /api/
# passed to the API container. Included inside nginx's http {} block by the official image.

# One line per request. rt = the whole request as nginx saw it (a slow upload counts);
# urt / uct = time the API took / time to connect to it.
log_format timing '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time';

# Docker's internal DNS: recreating the API container gives it a new IP, and `resolve` below
# follows it instead of keeping the address nginx saw at startup.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 8;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log timing;

    # server/ refuses more than 50 MiB of photos + 1 MiB of form with its own JSON 413
    # (photos/uploads.py); this sits just above so its message is the one the page shows.
    client_max_body_size 52m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;

    # vite build puts a content hash in every file name under /assets/: keep them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current hashed files, so the browser checks it every time; any other
    # path is a page of the app (React Router), which index.html draws.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Keep the port (<lan-ip>:8091): the CSRF check compares the Origin header with
        # scheme://Host (auth/csrf.py).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An upload of many photos makes their previews before it answers. Readings run in the
        # worker, so no request waits for the model.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
